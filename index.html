<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cars App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <span class="brand">My Cars</span>
            <button class="nav-tab active" id="nav-view-btn">My Cars</button>
            <button class="nav-tab" id="nav-create-btn">Create Car</button>
        </div>
        <div class="nav-right" id="nav-search-container">
            <input type="text" id="search-input" placeholder="Type something...">
            <button id="search-btn">Search</button>
            <button id="clear-btn">Clear</button>
        </div>
    </header>

    <main>
        <section id="view-page" class="page-container">
            <aside class="sidebar">
                <h2>Manage cars</h2>
                
                <div class="sort-section">
                    <span class="sort-label">Sort by the highest speed</span>
                    <label class="switch">
                        <input type="checkbox" id="sort-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>
                
                <hr class="divider">
                
                <div class="count-section">
                    <p class="count-label">Count total speed:</p>
                    <button id="count-btn">Count</button>
                    <div class="total-display">
                        <span>Total speed:</span>
                        <strong id="total-result">0</strong>
                    </div>
                </div>
            </aside>

            <div class="content">
                <div id="car-list-container" class="car-grid">
                </div>
            </div>
        </section>

        <section id="form-page" class="page-container hidden form-layout">
            <h1 id="form-title">Create car</h1>
            
            <form id="car-form" class="center-form">
                <input type="hidden" id="car-id">
                
                <div class="form-group">
                    <label for="car-brand">Title</label>
                    <input type="text" id="car-brand" placeholder="Text..." required>
                </div>

                <div class="form-group">
                    <label for="car-desc">Description (Year)</label>
                    <textarea id="car-desc" placeholder="Enter year or details..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="car-speed">Max speed (km/h)</label>
                    <input type="number" id="car-speed" value="0" min="1" required>
                </div>

                <div class="form-group">
                    <label for="car-type">Car Type</label>
                    <select id="car-type">
                        <option value="">Select Type</option>
                        <option value="sedan">Sedan</option>
                        <option value="suv">SUV</option>
                        <option value="hatchback">Hatchback</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn" class="submit-button">Submit</button>
            </form>

            <!-- Error Alert -->
            <div id="error-alert" class="alert-box hidden">
                <strong>Oh snap!</strong> Change a few things up and try submitting again.
                <button class="close-alert">&times;</button>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
